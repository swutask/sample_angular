<ion-header>
    <ion-toolbar #j_399 color="primary">
        <ion-title #j_401 color="dark">
            Wealth Builder
        </ion-title>
    </ion-toolbar>
</ion-header>
<ion-content>
    <form #j_393 class="wb-form" (submit)="updatePwd()" [formGroup]="fm">
        <h1 #j_394 class="signup-title">
            Update Password
            <br>
        </h1>
        <ion-item #j_395__ion4Item>
            <ion-label #j_395__ion4Label position="floating">
                New Password
            </ion-label>
            <ion-input #j_395 type="password" formControlName="password" name="password">
            </ion-input>
        </ion-item>
        <ion-item #j_396__ion4Item>
            <ion-label #j_396__ion4Label position="floating">
                Retype Password
            </ion-label>
            <ion-input #j_396 type="password" formControlName="password2" name="password2">
            </ion-input>
        </ion-item>
        <ion-button #j_397 color="dark" expand="block" size="default" type="submit" class="signup-button">
            UPDATE
        </ion-button>
    </form>
</ion-content>
<ion-footer>
    <ion-toolbar #j_403>
        <ion-title #j_405>
        </ion-title>
    </ion-toolbar>
</ion-footer>
