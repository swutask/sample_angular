<ion-content>
  <ion-progress-bar class="barprogress" color="main-theme ion-hide-sm-down" value="0.12"></ion-progress-bar>
  <ion-chip class="mainprogress ion-hide-sm-down">12%</ion-chip>
  <ion-img src="assets/images/logo_placeholder.svg" alt="Image error" class="logo_placeholder ion-hide-sm-down">
  </ion-img>
  <ion-item class="itemHeader ion-hide-sm-up" lines="none">
    <ion-buttons slot="start" class="backbox">
      <ion-button color="light" routerDirection="back" (click)="back()">
        <ion-icon src="assets/icon/arrowback.svg" >
        </ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-progress-bar class="barprogress" color="main-theme" value="0.12"></ion-progress-bar>
  </ion-item>
  <ion-chip class="mainprogress ion-hide-sm-up">12%</ion-chip>
  <h2>What is your level of financial education?</h2>
  <div class="backBtn cursor-pointer ion-hide-sm-down" (click)="back()">
    <ion-icon src="assets/icon/arrowback.svg" color="light"></ion-icon>
  </div>
  <ion-grid class="progressgrid">
    <ion-row>
      <ion-col size-lg="4" size-md="4" size-sm="12" size-xl="4" size-xs="12" *ngFor="let education of goalConstants.financialEducation">
        <div class="gridCard cursor-pointer" (click)="go(education.id)" [ngClass]="education.id==financialEducation?'selected':''">
          <div class="cardheading">
            <ion-img [src]="education.image"></ion-img>
            <ion-note class="ion-float-right slide-edit-note ion-margin-end ion-hide-sm-down">
              <ion-icon  src="../../assets/icon/arrowright.svg" class="arrow-icon">
              </ion-icon>
            </ion-note>
            </div>
            <div>
              <div class="textheading">{{education.label}}</div>
              <div class="textdescription ion-hide-sm-down">{{education.description}}</div>
            </div>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
  <div class="ion-text-center" (click)="updateEducation()">
    <ion-button mode="ios" shape="round" class="save ion-margin-top fullbtn ion-hide-sm-up">
      Continue
      <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
    </ion-button>
  </div>
  <!-- <div class="login-footer ion-text-center ion-hide-sm-up">
    <div>
      Already have an account? <strong class="registernew cursor-pointer" (click)="login()"> Sign In</strong>
    </div>
  </div> -->
</ion-content>
