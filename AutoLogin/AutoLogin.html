<ion-content>
<ion-modal [isOpen]="!isVersionAllowedToContinue" class="pwa-install-modal" [backdropDismiss]="false">
    <ng-template>
        <ion-content class="upgradeContent" scrollY="false">
            <img class="upgrade-logo" src="assets/images/logo.svg" alt="Image error">
            <div class="modal-container">
                <div class="modal-content">
                    <h1 class="updateheader">This version of the Wealth Builder mobile app is not supported.</h1>
                    <h2 class="updateheader">Please update to the latest version in order to continue.</h2>
                    <p (click)="update()" class="update cursor-pointer ">Click here to update the app.</p>
                </div>
            </div>
        </ion-content>
    </ng-template>
    </ion-modal>                          
</ion-content>
